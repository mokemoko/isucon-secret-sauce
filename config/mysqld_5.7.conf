[mysqld]
max_allowed_packet = 256M

innodb_buffer_pool_size = 2G
innodb_log_file_size=256M # buffer_pool_size * 0.25 = log_file_size * log_files_in_group

innodb_flush_neighbors=0
innodb_flush_method=O_DIRECT
innodb_doublewrite=0
innodb_flush_log_at_trx_commit=2

# 必要に応じて設定
# max_connections = 151
# join_buffer_size = 256K
# read_buffer_size = 256K
# read_rnd_buffer_size = 2M
# sort_buffer_size = 4M
# query_cache_size = 256M # <5.7 only
# query_cache_type = 1    # <5.7 only
# innodb_adaptive_hash_index = 0

# ストレージ最適化パラメータ
# innodb_io_capacity 1000 # 200
# innodb_io_capacity_max 4000 # 400
# innodb_buffer_pool_instances 4 # 8
# innodb_page_size 4KB # 16KB
# innodb_read_ahead_threshold 0 # 56
# innodb_read_io_threads 12 # 4
# innodb_write_io_threads 12 # 4

# for 8
# disable-log-bin

# for slowlog
slow_query_log=1
slow_query_log_file = /var/log/mysql/slow.log
long_query_time=0

# https://dev.mysql.com/doc/refman/5.6/ja/innodb-parameters.html
# http://hiroi10.hatenablog.com/entry/20151210/1449731029
