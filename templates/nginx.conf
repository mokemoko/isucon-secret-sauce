# ISUCON 用 nginx 設定の雛形。setup タスクが既存の設定と見比べて必要な部分だけ取り込む（丸ごと置き換えない）
# 勘所の解説は knowledge/middleware.md
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # 計測: alp json の既定キー (time, method, uri, status, body_bytes, response_time) に合わせる
    log_format json escape=json '{"time":"$time_iso8601",'
        '"host":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes":"$body_bytes_sent",'
        '"ua":"$http_user_agent",'
        '"response_time":"$request_time",'
        '"app_time":"$upstream_response_time"}';
    # 1リクエストごとの write を避ける。最終盤 (Phase 3) は access_log off にする
    access_log /var/log/nginx/access.log json buffer=64k flush=1s;
    error_log /var/log/nginx/error.log;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout  65;
    keepalive_requests 10000;

    # 動的圧縮は CPU を食う。静的ファイルは事前に .gz を作って gzip_static で返す
    # gzip on; gzip_min_length 1024; gzip_comp_level 1; gzip_types text/css application/javascript application/json;

    # open_file_cache max=10000 inactive=20s;
    # open_file_cache_valid 60s;
    # open_file_cache_errors on;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream app {
        server 127.0.0.1:8080;          # 同居なら unix:/run/isucon/app.sock も可 (templates/snippets/unix-domain-socket.md)
        # server 192.168.0.12:8080 weight=2;
        # hash $cookie_session consistent;  # 同じユーザーを同じ app に寄せる (オンメモリキャッシュを台ごとに持つとき)
        keepalive 128;                  # proxy_http_version 1.1 と Connection "" が揃って初めて効く
    }

    server {
        listen 80;
        root /home/isucon/webapp/public;

        # 静的ファイルは nginx が直接返す
        location ~ ^/(css|js|img|favicon\.ico) {
            gzip_static on;
            expires 1d;                 # 期限・ETag をベンチマーカーが尊重するかは当日マニュアルで確認
        }

        # アプリが認可だけして nginx にファイルを返させる (X-Accel-Redirect: /protected/xxx)
        # location /protected/ { internal; alias /home/isucon/webapp/files/; }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass http://app;
        }
    }
}
