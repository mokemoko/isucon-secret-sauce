worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    log_format ltsv "time:$time_local"
                "\thost:$remote_addr"
                "\tforwardedfor:$http_x_forwarded_for"
                "\treq:$request"
                "\tstatus:$status"
                "\tmethod:$request_method"
                "\turi:$request_uri"
                "\tsize:$body_bytes_sent"
                "\treferer:$http_referer"
                "\tua:$http_user_agent"
                "\treqtime:$request_time"
                "\tcache:$upstream_http_x_cache"
                "\truntime:$upstream_http_x_runtime"
                "\tapptime:$upstream_response_time"
                "\tvhost:$host";

    # access_log  off;
    access_log  /var/log/nginx/access.log  ltsv;
    error_log /var/log/nginx/error.log;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  10000;
  
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json;
    
    # use file cache
    # open_file_cache max=10000 inactive=20s;
    # open_file_cache_valid 65s;
    # open_file_cache_min_uses 2;
    # open_file_cache_errors on;
    
    # use limit
    # limit_conn_zone $binary_remote_addr zone=conn:10m;
    # limit_conn conn 100;
    # limit_req_zone $binary_remote_addr zone=req:10m rate=100r/s;
    # limit_req zone=req burst=5 nodelay;
    # limit_req_status 500;
    # limit_rate_after 1k;
    # limit_rate 50k;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
  
    upstream app {
        server localhost:3000;
        # server x.x.x.x weight=5;
        keepalive 128;
    }

    server {
        # listen 443 ssl http2;
        listen       80;
        root         /home/isucon/public;

        location ^~ /public {
            gzip_static always;
            expires max;
            etagg off;
            autoindex on; # for profile
            # try_files $uri @app;
        }
    
        location /  {
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_pass http://app;
            # proxy_buffers 16 16k;
        }
    }
}
