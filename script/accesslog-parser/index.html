<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>アクセスログ時系列分析</title>
  <style>
    #content {
      position: relative;
      margin: 24px;
    }
    .user {
      position: absolute;
      outline: 1px dashed black;
      outline-offset: 2px;
    }
    .bar {
      position: absolute;
      background-color: gray;
      height: 5px;
    }
    .bar:last-child::after {
      background-color: red;
    }
    .bar:hover::after {
      content: attr(data-path);
      position: absolute;
      pointer-events: none;
      top: -20px;
      padding: 1px;
      font-size: small;
      color: white;
      background-color: navy;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="content"></div>
  <script>
    (async () => {
      const USER_MARGIN = 2;
      const BAR_HEIGHT = 5;
      const data = await (await fetch("./out.json")).json()
      let dy = 0
      data.forEach(user => {
        const p = document.createElement("div")
        p.className = "user"
        p.style.top = `${dy}px`
        p.style.left = `${user.start}px`
        p.style.width = `${user.end - user.start}px`
        p.style.height = `${user.data.length * (BAR_HEIGHT + 1) - 1}px`
        dy += user.data.length * (BAR_HEIGHT + 1) - 1 + USER_MARGIN * 4
        user.data.forEach((v, i) => {
          const bar = document.createElement("div")
          bar.className = "bar"
          bar.style.top = `${i * 6}px`
          bar.style.left = `${v.start - user.start}px`
          bar.style.width = `${v.end - v.start}px`
          bar.dataset.path = v.path
          p.appendChild(bar)
        })
        document.querySelector("#content").appendChild(p)
      })
    })()
  </script>
</body>
</html>
